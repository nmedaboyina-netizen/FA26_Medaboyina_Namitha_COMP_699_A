{% extends "base.html" %}{% block content %}<h2>{{ page_title }}</h2>
<form method="post" class="panel">
<label>Description<input name="description" required value="{{ event.description if event else '' }}"></label>
<label>Start time<input type="datetime-local" name="start_time" required value="{{ event.start_time[:16] if event else '' }}"></label>
<label>End time<input type="datetime-local" name="end_time" required value="{{ event.end_time[:16] if event else '' }}"></label>
<label>Location<input name="location" required value="{{ event.location if event else '' }}"></label>
<label>Duration (minutes)<input type="number" min="0" step="0.1" name="duration_minutes" required value="{{ event.duration_minutes if event else '0' }}"></label>
<label>Source type<select name="source_type">{% for s in ['Observation','Surveillance','Phone Record','Movement','Witness','Other'] %}
<option {% if event and event.source_type==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label>
<button>Save event</button></form>{% endblock %}
